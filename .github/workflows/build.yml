name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build (amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o maxtunnel-server .

      - name: Build (arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o maxtunnel-server-arm64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            maxtunnel-server
            maxtunnel-server-arm64

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            maxtunnel-server
            maxtunnel-server-arm64
          body: |
            ## maxtunnel-server v${{ github.ref_name }}

            ### Изменения
            ${{ github.event.head_commit.message || 'Автоматическая сборка' }}

            ### Установка
            ```bash
            install -m 0755 maxtunnel-server /usr/local/bin/maxtunnel-server
            systemctl restart maxtunnel
            ```

            ### Обновление через приложение
            Откройте MaxTunnel → Деплой → кнопка **Обновить сервер**
